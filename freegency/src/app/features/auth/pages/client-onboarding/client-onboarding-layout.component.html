<div
  class="relative flex min-h-dvh flex-col items-center overflow-x-hidden bg-background"
  [class.pb-8]="!flush()"
  [class.sm:pb-12]="!flush()"
>
  @if (!appHeader()) {
    <app-auth-ambient-bg />
  }

  @if (appHeader()) {
    <app-client-view-navbar class="relative z-30 w-full overflow-visible" />
  } @else {
    <app-onboarding-header class="relative z-10 w-full" [step]="step()" [filled]="filled()" />
  }

  <main
    class="relative z-10 mx-auto flex w-full flex-1 flex-col items-center"
    [class.justify-center]="center()"
  >
    <router-outlet />
  </main>
</div>
