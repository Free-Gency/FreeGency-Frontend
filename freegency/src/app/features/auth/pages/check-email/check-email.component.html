<div
  class="relative flex min-h-dvh flex-col items-center overflow-x-hidden bg-background px-10 pb-12"
>
  <app-auth-ambient-bg />

  <app-header class="relative z-10" />

  <main
    class="relative z-10 mx-auto flex w-full max-w-[500px] flex-col items-center gap-10 md:max-w-[670px] lg:max-w-[500px]"
  >
    <img
      src="/assets/auth/Mail.png"
      alt=""
      class="mt-6 h-auto w-[180px] max-w-full shrink-0 object-contain sm:mt-8 sm:w-[200px] md:mt-10 md:w-[240px] lg:mt-12 lg:w-[260px]"
      aria-hidden="true"
    />

    <section class="flex w-full flex-col gap-4 text-center">
      <h1
        class="font-display text-[24px] leading-8 font-bold tracking-tight text-on-surface sm:text-[28px] sm:leading-9 md:text-[32px] md:leading-10 lg:text-[30px] lg:leading-9 xl:text-[40px] xl:leading-[48px]"
      >
        Check your email
      </h1>
      <p class="text-body-md text-on-surface-variant md:text-body-lg">
        We've sent a verification link to
        <strong class="font-semibold text-on-surface">{{ email }}</strong
        >. Click the link in the email to finish setting up your account.
      </p>
    </section>

    <div class="flex w-full flex-col items-center gap-8">
      <button
        type="button"
        (click)="openEmailInbox()"
        class="inline-flex h-[55px] w-full cursor-pointer items-center justify-center rounded-full bg-primary-container px-4 font-display text-base font-bold text-on-primary shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-[background-color,transform] duration-150 hover:bg-primary active:scale-[0.98] md:text-xl"
      >
        {{ inboxLabel }}
      </button>

      <p class="text-center text-body-md text-on-surface-variant">
        Didn't receive the email?
        <button
          type="button"
          class="cursor-pointer border-none bg-transparent font-bold text-primary-container underline decoration-primary-container/10 underline-offset-2"
        >
          Resend
        </button>
      </p>

      <a
        routerLink="/auth/login"
        class="font-bold text-primary-container underline decoration-primary-container/10 underline-offset-2"
      >
        ← Back to Login
      </a>
    </div>
  </main>
</div>
