<div
  class="relative flex min-h-dvh flex-col items-center justify-center overflow-x-hidden bg-background px-6 py-10"
>
  <app-auth-ambient-bg />

  <div
    class="relative z-10 mx-auto flex w-full max-w-[400px] flex-col items-center gap-8 sm:max-w-[440px]"
  >
    <img
      src="/assets/brand/logo.svg"
      alt="FreeGency"
      class="block h-8 w-auto sm:h-9"
      width="160"
      height="36"
    />

    <img
      src="/assets/auth/mail.png"
      alt=""
      class="h-auto w-[160px] shrink-0 object-contain sm:w-[180px]"
      aria-hidden="true"
    />

    <section class="flex w-full flex-col gap-3 text-center">
      <h1
        class="font-display text-[28px] leading-9 font-bold tracking-tight text-on-surface sm:text-[32px] sm:leading-10"
      >
        Check your email
      </h1>
      <p class="text-base leading-6 text-on-surface-variant sm:leading-7">
        We've sent a verification link to
        @if (email) {
          <strong class="font-semibold text-on-surface">{{ email }}</strong>
        } @else {
          <strong class="font-semibold text-on-surface">your email</strong>
        }
        . Click the link in the email to finish setting up your account.
      </p>
    </section>

    <div class="flex w-full flex-col items-center gap-6">
      <button
        type="button"
        (click)="openEmailInbox()"
        class="inline-flex h-12 w-full cursor-pointer items-center justify-center rounded-full bg-primary-container px-4 font-display text-base font-bold text-on-primary shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-[background-color,transform] duration-150 hover:bg-primary active:scale-[0.98]"
      >
        {{ inboxLabel }}
      </button>

      <p class="text-center text-base text-on-surface-variant">
        Didn't receive the email?
        <button
          type="button"
          class="cursor-pointer border-none bg-transparent font-bold text-primary-container underline decoration-primary-container/10 underline-offset-2"
        >
          Resend
        </button>
      </p>

      <a
        routerLink="/auth/login"
        class="font-bold text-primary-container underline decoration-primary-container/10 underline-offset-2"
      >
        ← Back to Login
      </a>
    </div>
  </div>
</div>
