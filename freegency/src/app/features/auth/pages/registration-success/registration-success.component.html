<div
  class="flex min-h-dvh flex-col items-center bg-background px-8 pb-12 md:px-10 md:py-12 lg:px-[64px] lg:py-16"
>
  <app-header />

  <main
    class="mx-auto flex w-full max-w-[500px] flex-col items-center gap-10 md:max-w-[670px] lg:max-w-[500px]"
  >
    <img
      src="/assets/auth/check-icon.png"
      alt=""
      class="mt-6 h-auto w-[150px] max-w-full shrink-0 object-contain sm:mt-8 sm:w-[170px] md:mt-10 md:w-[190px] lg:mt-12 lg:w-[210px]"
      aria-hidden="true"
    />

    <section class="flex w-full flex-col gap-4 text-center">
      <h1
        class="font-display text-[24px] leading-8 font-bold tracking-tight text-on-surface sm:text-[28px] sm:leading-9 md:text-[32px] md:leading-10 lg:text-[30px] lg:leading-9 xl:text-[40px] xl:leading-[48px]"
      >
        You're Registered with&nbsp;FreeGency
      </h1>
      <p class="text-body-md text-on-surface-variant md:text-body-lg">
        You can use these details to log back into FreeGency
      </p>
    </section>

    <div class="flex w-full flex-col items-center gap-6">
      <button
        type="button"
        class="inline-flex h-[55px] w-full cursor-pointer items-center justify-center rounded-full bg-primary-container px-4 font-display text-base font-bold text-on-primary shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-[background-color,transform] duration-150 hover:bg-primary active:scale-[0.98] md:text-xl"
        (click)="continueNow()"
      >
        Continue
      </button>

      <p class="text-center text-body-md text-on-surface-variant">
        Redirecting automatically in
        <span class="font-semibold text-primary-container">{{ countdown() }}s</span>
      </p>
    </div>
  </main>
</div>
