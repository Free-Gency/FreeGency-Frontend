<div
  class="relative flex min-h-dvh flex-col items-center justify-center overflow-x-hidden bg-background px-5 py-8"
>
  <app-auth-ambient-bg />

  <div
    class="onboarding-main relative z-10 mx-auto flex w-full max-w-[720px] flex-col items-center"
  >
    <img
      src="/assets/brand/logo.svg"
      alt="FreeGency"
      class="mb-6 block h-8 w-auto sm:mb-8 sm:h-9"
      width="160"
      height="36"
    />

    <section class="onboarding-question flex w-full max-w-[480px] flex-col gap-2 text-center sm:gap-3">
      <h1
        class="font-display text-[26px] leading-8 font-bold tracking-tight text-on-surface sm:text-[32px] sm:leading-10"
      >
        How would you like to use&nbsp;FreeGency?
      </h1>
      <p class="text-sm leading-5 text-on-surface-variant sm:text-base sm:leading-6">
        Which describes you best? You can always add the other profile later.
      </p>
    </section>

    <div class="onboarding-panel">
      <div class="onboarding-panel-inner">
        <div class="flex w-full flex-col items-stretch justify-center gap-4 sm:flex-row sm:gap-5">
          <button
            type="button"
            class="onboarding-card group flex flex-1 cursor-pointer flex-col items-center rounded-2xl border border-surface-container-high bg-surface-container-lowest px-5 py-6 text-center transition-[border-color,box-shadow,transform] duration-150 hover:border-primary-container/40 hover:shadow-[0_8px_24px_rgba(91,79,240,0.08)] active:scale-[0.99] sm:px-8 sm:py-8"
            (click)="selectMode('Developer')"
          >
            <img
              src="/assets/onboarding/toolbox.png"
              alt=""
              width="120"
              height="120"
              class="mb-5 size-[96px] shrink-0 object-contain sm:size-[120px]"
              aria-hidden="true"
            />
            <h2
              class="mb-2 font-display text-lg leading-6 font-semibold text-on-surface sm:text-xl sm:leading-7"
            >
              Sign up as a freelancer
            </h2>
            <p class="mb-5 max-w-[240px] text-sm leading-5 text-on-surface-variant">
              Showcase your portfolio, find high-quality work, and collaborate.
            </p>
            <span
              class="inline-flex items-center gap-1.5 font-display text-sm font-semibold text-primary-container transition-transform duration-150 group-hover:translate-x-0.5"
            >
              Get started
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M5.25 2.917 9.333 7 5.25 11.083"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>

          <button
            type="button"
            class="onboarding-card onboarding-card--late group flex flex-1 cursor-pointer flex-col items-center rounded-2xl border border-surface-container-high bg-surface-container-lowest px-5 py-6 text-center transition-[border-color,box-shadow,transform] duration-150 hover:border-primary-container/40 hover:shadow-[0_8px_24px_rgba(91,79,240,0.08)] active:scale-[0.99] sm:px-8 sm:py-8"
            (click)="selectMode('Client')"
          >
            <img
              src="/assets/onboarding/briefcase.png"
              alt=""
              width="120"
              height="120"
              class="mb-5 size-[96px] shrink-0 object-contain sm:size-[120px]"
              aria-hidden="true"
            />
            <h2
              class="mb-2 font-display text-lg leading-6 font-semibold text-on-surface sm:text-xl sm:leading-7"
            >
              Sign up to hire
            </h2>
            <p class="mb-5 max-w-[240px] text-sm leading-5 text-on-surface-variant">
              Find specialized talent, launch projects, and hire freelancers.
            </p>
            <span
              class="inline-flex items-center gap-1.5 font-display text-sm font-semibold text-primary-container transition-transform duration-150 group-hover:translate-x-0.5"
            >
              Explore talent
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M5.25 2.917 9.333 7 5.25 11.083"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>

        <p class="onboarding-footer pt-8 text-center text-sm text-on-surface-variant">
          Already have an account?
          <a
            routerLink="/auth/login"
            class="font-bold text-primary underline decoration-primary/10 underline-offset-2"
          >
            Log in
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
