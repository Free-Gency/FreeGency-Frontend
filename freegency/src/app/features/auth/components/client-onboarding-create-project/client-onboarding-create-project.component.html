<section
  class="create-project-section relative z-10 mx-auto flex w-full max-w-[986px] flex-1 flex-col items-center px-5 pb-12 pt-16 sm:px-10 sm:pt-24 lg:pt-28"
>
  <div
    class="create-project-heading mb-8 flex w-full max-w-[721px] flex-col items-center gap-4 text-center sm:mb-12"
  >
    <h1
      class="font-display text-[28px] leading-9 font-bold tracking-[-0.02em] text-on-surface sm:text-[40px] sm:leading-[48px] sm:tracking-[-1.2px] lg:text-[48px] lg:leading-[57.6px]"
    >
      Let's start with your first job post
    </h1>
    <p class="font-body text-sm leading-5 text-on-surface-variant sm:text-base sm:leading-6">
      It's the fastest route to matching with the right talent.<br class="hidden sm:inline" />
      Just describe what you need and let AI handle the post instantly.
    </p>
  </div>

  <div class="create-project-actions flex w-full max-w-[560px] flex-col items-center gap-6">
    @if (errorMessage()) {
      <p class="w-full text-center text-sm text-error" role="alert">{{ errorMessage() }}</p>
    }

    <button
      type="button"
      class="create-project-primary"
      [disabled]="loading()"
      (click)="onGenerateWithAi()"
    >
      <hugeicons-icon
        [icon]="sparklesIcon"
        [size]="24"
        color="currentColor"
        [strokeWidth]="1.75"
        aria-hidden="true"
      />
      <span>{{ loading() ? 'Saving...' : 'Generate with AI' }}</span>
    </button>

    <button
      type="button"
      class="create-project-secondary"
      [disabled]="loading()"
      (click)="onWithoutAi()"
    >
      I'll do it without AI
    </button>
  </div>

  <div class="create-project-spacer" aria-hidden="true"></div>

  <div class="flex w-full max-w-[560px] flex-col items-center">
    <button
      type="button"
      class="create-project-skip"
      [disabled]="loading()"
      (click)="onSkip()"
    >
      Skip for now
    </button>
  </div>
</section>
