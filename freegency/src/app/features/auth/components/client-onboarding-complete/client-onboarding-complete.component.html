<section
  class="complete-section relative z-10 mx-auto flex w-full max-w-[720px] flex-col items-center gap-10 px-5 pb-12 pt-16 text-center sm:gap-12 sm:px-10 sm:pt-24"
>
  <div class="complete-heading flex w-full flex-col items-center gap-4 sm:gap-5">
    <h1
      class="font-display text-[28px] leading-9 font-bold tracking-[-0.02em] text-on-surface sm:text-[40px] sm:leading-[48px] sm:tracking-[-1.2px] lg:text-[48px] lg:leading-[57.6px]"
    >
      You're all set, {{ greetingName() }}!
    </h1>
    <p
      class="max-w-[560px] font-body text-sm leading-5 text-on-surface-variant sm:text-base sm:leading-6"
    >
      Your profile is set up and you're ready to start exploring.
      <br class="hidden sm:inline" />
      Connect with top-tier talent and start finding the right expertise for your needs.
    </p>
  </div>

  <button
    type="button"
    class="complete-cta inline-flex h-[50px] w-full max-w-[560px] cursor-pointer items-center justify-center rounded-full bg-primary-container px-4 font-display text-lg leading-4 font-semibold text-on-primary shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-[background-color,transform] duration-150 hover:bg-primary active:scale-[0.98] sm:h-[55px] sm:text-xl sm:font-bold"
    (click)="goToDashboard()"
  >
    Go to dashboard
  </button>
</section>
