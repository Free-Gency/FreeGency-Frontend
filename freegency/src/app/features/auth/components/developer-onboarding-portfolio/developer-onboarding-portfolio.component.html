<section
  class="relative z-10 mx-auto flex w-full max-w-[560px] flex-col items-stretch gap-8 px-5 pb-12 pt-3 sm:px-10"
>
  <div class="flex w-full flex-col items-center gap-[7px] text-center">
    <h1
      class="font-display text-[32px] leading-[1.1] font-bold tracking-[-0.02em] text-on-surface sm:text-[48px] sm:leading-[52.8px] sm:tracking-[-0.96px]"
    >
      Add a portfolio project
    </h1>
    <p class="font-body text-base leading-7 text-on-surface-variant sm:text-lg sm:leading-[28.8px]">
      Optional — showcase one piece of work so clients can see what you build.
    </p>
  </div>

  <form class="flex w-full flex-col gap-6" (ngSubmit)="onContinue()">
    <div class="flex flex-col items-center">
      <button
        type="button"
        class="flex h-40 w-full cursor-pointer flex-col items-center justify-center gap-2 overflow-hidden rounded-2xl border-2 border-dashed border-outline-variant bg-surface-container-low transition-[border-color,background-color] duration-150 hover:border-primary-container/50 focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-primary/12"
        (click)="openFilePicker()"
        aria-label="Upload cover image"
      >
        @if (previewUrl(); as url) {
          <img [src]="url" alt="Cover preview" class="size-full object-cover" />
        } @else {
          <hugeicons-icon
            [icon]="uploadIcon"
            [size]="28"
            color="currentColor"
            [strokeWidth]="1.75"
            aria-hidden="true"
          />
          <span class="font-mono text-sm font-medium tracking-[0.28px] text-outline">
            COVER IMAGE (OPTIONAL)
          </span>
        }
      </button>
      <input
        #coverInput
        type="file"
        class="sr-only"
        accept="image/jpeg,image/png,image/webp"
        (change)="onFileSelected($event)"
      />
      @if (uploadError()) {
        <p class="mt-2 text-center text-xs text-error" role="alert">{{ uploadError() }}</p>
      }
    </div>

    <div class="flex w-full flex-col gap-2">
      <label
        class="block font-mono text-base leading-4 font-bold text-on-surface"
        for="portfolioTitle"
      >
        Project title
      </label>
      <input
        id="portfolioTitle"
        type="text"
        name="title"
        class="w-full rounded-lg border border-[rgba(229,225,228,0.2)] bg-surface-container-low px-[17px] py-[19px] font-body text-base text-on-surface placeholder:text-outline/50 transition-[background-color,border-color,box-shadow] duration-150 focus:border-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-[3px] focus:ring-primary/12"
        placeholder="e.g. Freelancer marketplace redesign"
        [(ngModel)]="title"
      />
    </div>

    <div class="flex w-full flex-col gap-2">
      <div class="flex items-center justify-between px-1">
        <label
          class="font-mono text-base leading-4 font-bold text-on-surface"
          for="portfolioDesc"
        >
          Short description
        </label>
        <span class="font-mono text-sm font-medium tracking-[0.28px] text-outline">
          {{ descCount }}/{{ descLimit }}
        </span>
      </div>
      <textarea
        id="portfolioDesc"
        name="description"
        rows="4"
        class="min-h-[120px] w-full resize-y rounded-lg border border-[rgba(229,225,228,0.2)] bg-surface-container-low px-[17px] py-[17px] font-body text-base leading-6 text-on-surface placeholder:text-outline/50 transition-[background-color,border-color,box-shadow] duration-150 focus:border-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-[3px] focus:ring-primary/12"
        placeholder="What was the problem, and what did you ship?"
        [(ngModel)]="description"
        (ngModelChange)="onDescInput($event)"
        [attr.maxlength]="descLimit"
      ></textarea>
    </div>

    <div class="flex w-full flex-col gap-2">
      <label
        class="block font-mono text-base leading-4 font-bold text-on-surface"
        for="portfolioUrl"
      >
        Project URL
        <span class="font-normal text-outline"> (optional)</span>
      </label>
      <input
        id="portfolioUrl"
        type="url"
        name="projectUrl"
        class="w-full rounded-lg border border-[rgba(229,225,228,0.2)] bg-surface-container-low px-[17px] py-[19px] font-body text-base text-on-surface placeholder:text-outline/50 transition-[background-color,border-color,box-shadow] duration-150 focus:border-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-[3px] focus:ring-primary/12"
        placeholder="https://"
        [(ngModel)]="projectUrl"
      />
    </div>

    <div class="flex w-full flex-col gap-2">
      <label
        class="block font-mono text-base leading-4 font-bold text-on-surface"
        for="portfolioCategory"
      >
        Category
        <span class="font-normal text-outline"> (optional)</span>
      </label>
      <select
        id="portfolioCategory"
        name="categoryId"
        class="w-full appearance-none rounded-lg border border-[rgba(229,225,228,0.2)] bg-surface-container-low px-[17px] py-[19px] font-body text-base text-on-surface transition-[background-color,border-color,box-shadow] duration-150 focus:border-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-[3px] focus:ring-primary/12"
        [(ngModel)]="categoryId"
      >
        <option value="">Select a category</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.nameEn || cat.name }}</option>
        }
      </select>
    </div>

    <div class="flex w-full flex-col items-center gap-6 pt-4">
      @if (errorMessage()) {
        <p class="w-full text-center text-sm text-error" role="alert">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        class="inline-flex h-[50px] w-full cursor-pointer items-center justify-center rounded-full bg-primary-container px-4 font-display text-lg leading-4 font-semibold text-on-primary shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-[background-color,transform] duration-150 hover:bg-primary active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="loading()"
      >
        {{ loading() ? 'Saving...' : 'Continue' }}
      </button>

      <button
        type="button"
        class="cursor-pointer border-none bg-transparent font-display text-base leading-4 font-semibold text-outline transition-colors duration-150 hover:text-on-surface-variant disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="loading()"
        (click)="onSkip()"
      >
        Skip for now
      </button>

      <button
        type="button"
        class="cursor-pointer border-none bg-transparent font-body text-sm text-on-surface-variant underline-offset-2 hover:underline disabled:opacity-50"
        [disabled]="loading()"
        (click)="goBack()"
      >
        Back to skills
      </button>
    </div>
  </form>
</section>
