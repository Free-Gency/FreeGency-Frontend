<section class="relative z-10 flex w-full flex-1 flex-col">
  <div
    class="mx-auto flex w-full max-w-[1512px] flex-1 flex-col items-center gap-6 px-5 py-5 sm:gap-7 sm:px-10 sm:py-6 lg:px-20 lg:py-7"
  >
    <!-- Progress: 3 steps, first active (in-app only; onboarding uses header stepper) -->
    @if (showStepProgress) {
      <div class="flex w-full items-start justify-center gap-2" aria-label="Progress">
        @for (step of [1, 2, 3]; track step) {
          <div
            class="relative h-1 flex-1 overflow-hidden rounded-full bg-surface-container-high"
          >
            <div
              class="absolute inset-0 rounded-full bg-primary-container"
              [class.ai-desc-progress-fill]="step === currentStep"
              [class.opacity-0]="step !== currentStep"
            ></div>
          </div>
        }
      </div>
    }

    <div class="ai-desc-content flex w-full flex-col items-center">
      <div class="mb-6 flex w-full max-w-[700px] flex-col items-center gap-3 text-center sm:mb-8 sm:gap-4">
        <h1
          class="font-display text-[28px] leading-9 font-bold tracking-[-0.03em] text-on-surface sm:text-[40px] sm:leading-[48px] lg:text-[48px] lg:leading-[57.6px] lg:tracking-[-1.2px]"
        >
          Tell us about your project
        </h1>
        <p
          class="w-full font-body text-sm leading-6 text-on-surface-variant sm:text-base"
        >
          Describe your requirements, goals, and who you're looking for.
          <br class="hidden sm:inline" />
          Our AI will craft the perfect job post for you.
        </p>
      </div>

      <div class="relative w-full max-w-[700px]">
        <label class="sr-only" for="project-ai-description">Project description</label>
        <textarea
          id="project-ai-description"
          rows="6"
          [ngModel]="description()"
          (ngModelChange)="onDescriptionInput($event)"
          [attr.maxlength]="maxChars"
          placeholder="e.g., I need a UI/UX designer to redesign our mobile banking app. The focus is on simplifying the transaction flow for elderly users, requiring deep accessibility knowledge and high-fidelity prototyping skills in Figma..."
          class="min-h-[200px] w-full resize-y rounded-2xl border-0 bg-[#f6f6f6] px-6 pt-5 pb-12 font-body text-base leading-[1.6] text-on-surface outline-none placeholder:text-[#6b7280] focus-visible:ring-2 focus-visible:ring-primary/20 sm:min-h-[220px] sm:px-8 sm:pt-6 sm:pb-14 sm:text-lg sm:leading-[28.8px]"
        ></textarea>

        <div
          class="pointer-events-none absolute right-4 bottom-4 left-4 flex items-end justify-between gap-3 sm:right-6 sm:bottom-5 sm:left-8"
        >
          <span class="font-mono text-xs leading-[18px] font-medium text-on-surface-variant/60">
            {{ charCountLabel() }}
          </span>

          <span
            class="inline-flex items-center gap-2 rounded-full bg-[#ffe7ff]/90 px-3 py-1.5 backdrop-blur-[2px]"
          >
            <span class="inline-flex size-4 items-center justify-center text-primary" aria-hidden="true">
              <hugeicons-icon
                [icon]="sparklesIcon"
                [size]="16"
                color="currentColor"
                [strokeWidth]="1.75"
              />
            </span>
            <span
              class="font-mono text-[11px] leading-[18px] font-medium tracking-[0.1em] text-on-surface-variant uppercase sm:text-xs"
            >
              AI Assisted
            </span>
          </span>
        </div>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="mt-4 w-full max-w-[700px] text-center text-sm text-error" role="alert">
        {{ errorMessage() }}
      </p>
    }
  </div>

  <app-step-footer-actions
    class="mt-auto w-full"
    [continueDisabled]="!canContinue()"
    [continueLoading]="loading()"
    continueLoadingLabel="Generating..."
    continueLabel="Continue"
    (back)="onBack()"
    (continue)="onContinue()"
  />
</section>
