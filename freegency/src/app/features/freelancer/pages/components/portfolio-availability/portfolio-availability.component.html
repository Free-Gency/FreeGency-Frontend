<div class="pf-avail">
  <div class="pf-avail__head">
    <h2 class="pf-avail__title">Availability</h2>
    @if (canEdit()) {
      <button type="button" class="pf-avail__edit" aria-label="Edit availability">
        <span class="material-symbols-outlined">edit</span>
      </button>
    }
  </div>

  <div class="pf-avail__status">
    <div class="pf-avail__status-left">
      <span
        class="pf-avail__dot"
        [class.pf-avail__dot--on]="isAvailable()"
      ></span>
      <span class="pf-avail__status-text">
        {{ isAvailable() ? 'Available now' : 'Not available' }}
      </span>
    </div>

    @if (canEdit()) {
      <div
        (click)="toggleAvailability()"
        class="pf-avail__toggle"
        [class.pf-avail__toggle--on]="isAvailable()"
        role="switch"
        [attr.aria-checked]="isAvailable()"
      >
        <div class="pf-avail__toggle-knob"></div>
      </div>
    }
  </div>

  <div class="pf-avail__rows">
    <div class="pf-avail__row">
      <span class="pf-avail__key">Location</span>
      <span class="pf-avail__val">{{ profile().country || '—' }}</span>
    </div>
    <div class="pf-avail__row">
      <span class="pf-avail__key">Timezone</span>
      <span class="pf-avail__val">{{ timezoneLabel() }}</span>
    </div>
    @if (profile().hourlyRate) {
      <div class="pf-avail__row">
        <span class="pf-avail__key">Hourly rate</span>
        <span class="pf-avail__val">${{ profile().hourlyRate }}/hr</span>
      </div>
    }
  </div>
</div>
