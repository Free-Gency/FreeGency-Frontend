<div class="pf-about">
  <div class="pf-about__head">
    <h2 class="pf-about__title">About</h2>

    @if (canEdit() && !isEditing()) {
      <button type="button" (click)="startEditing()" class="pf-about__edit" aria-label="Edit about">
        <span class="material-symbols-outlined">edit</span>
      </button>
    }
  </div>

  @if (!isEditing()) {
    <p class="pf-about__body">
      {{ bio() || 'No bio provided yet.' }}
    </p>
  } @else {
    <div class="pf-about__edit-panel">
      <textarea
        [ngModel]="tempBio()"
        (ngModelChange)="tempBio.set($event)"
        rows="5"
        class="pf-about__textarea"
      ></textarea>

      <div class="pf-about__actions">
        <button type="button" (click)="cancelEditing()" class="pf-about__btn pf-about__btn--ghost">
          Cancel
        </button>
        <button type="button" (click)="saveBio()" class="pf-about__btn pf-about__btn--primary">
          Save
        </button>
      </div>
    </div>
  }
</div>
