<article class="pf-project">
  <div class="pf-project__media">
    @if (project().imageCover) {
      <img [src]="project().imageCover" alt="" />
    } @else {
      <div class="pf-project__media-fallback">
        <span class="material-symbols-outlined">image</span>
      </div>
    }

    @if (canEdit()) {
      <div class="pf-project__actions" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="pf-project__action-btn"
          aria-label="Edit project"
          (click)="edit.emit(project())"
        >
          <span class="material-symbols-outlined">edit</span>
        </button>
        <button
          type="button"
          class="pf-project__action-btn pf-project__action-btn--danger"
          aria-label="Delete project"
          (click)="remove.emit(project())"
        >
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    }
  </div>

  <div class="pf-project__body">
    <h3 class="pf-project__title">{{ project().title }}</h3>
    <p class="pf-project__desc">{{ project().description }}</p>

    @if (project().categoryName) {
      <div class="pf-project__tags">
        <span class="pf-project__tag">{{ project().categoryName }}</span>
      </div>
    }
  </div>
</article>
