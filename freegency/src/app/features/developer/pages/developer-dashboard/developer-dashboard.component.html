<div class="min-h-dvh bg-[#f7f7f9]">
  <header class="flex w-full items-center justify-between border-b border-outline-variant/40 bg-white px-5 py-4 sm:px-10 lg:px-16">
    <a href="/developer/dashboard" aria-label="FreeGency developer dashboard">
      <img src="/assets/brand/logo.svg" alt="FreeGency" class="h-8 w-auto sm:h-9" />
    </a>

    <button
      type="button"
      class="inline-flex size-10 cursor-pointer items-center justify-center rounded-full bg-[#f6f6f6] text-on-surface-variant transition-colors hover:text-on-surface"
      aria-label="Log out"
      (click)="logout()"
    >
      <hugeicons-icon [icon]="logoutIcon" [size]="19" color="currentColor" />
    </button>
  </header>

  <main class="mx-auto flex w-full max-w-[1400px] flex-col px-5 py-8 sm:px-10 lg:px-16 lg:py-12">
    <section class="dashboard-heading">
      <p class="font-mono text-xs tracking-[0.1em] text-primary-container uppercase">
        Developer dashboard
      </p>
      <h1 class="mt-2 font-display text-3xl font-bold text-on-surface sm:text-4xl">
        Welcome back, {{ firstName() }}
      </h1>
      <p class="mt-3 font-body text-sm text-on-surface-variant sm:text-base">
        Find projects, manage proposals, and keep track of your earnings.
      </p>
    </section>
  </main>
</div>
