
@if (isOpen()) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-sm" (click)="close()">
    <div class="card card-modal w-full max-w-[520px] max-h-[90vh] overflow-y-auto flex flex-col gap-sm" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h2 class="text-headline-md">Edit Project</h2>
        <button
          class="text-outline hover:text-on-surface hover:bg-surface-container-high p-1 rounded-sm flex items-center"
          (click)="close()"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="flex flex-col gap-sm">
        <div class="flex flex-col gap-1">
          <label class="field-label">Title</label>
          <input class="input" type="text" [(ngModel)]="title" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="field-label">Description</label>
          <textarea class="input textarea" rows="4" [(ngModel)]="description"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-sm">
          <div class="flex flex-col gap-1">
            <label class="field-label">Budget Min</label>
            <input class="input" type="number" [(ngModel)]="budgetMin" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="field-label">Budget Max</label>
            <input class="input" type="number" [(ngModel)]="budgetMax" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-sm">
          <div class="flex flex-col gap-1">
            <label class="field-label">Currency</label>
            <input class="input" type="text" [(ngModel)]="currency" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="field-label">Deadline</label>
            <input class="input" type="date" [(ngModel)]="deadline" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-sm">
          <div class="flex flex-col gap-1">
            <label class="field-label">Duration (days)</label>
            <input class="input" type="number" [(ngModel)]="estimatedDurationDays" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="field-label">Visibility</label>
            <select class="input" [(ngModel)]="visibility">
              <option value="Public">Public</option>
              <option value="Private">Private</option>
            </select>
          </div>
        </div>
      </div>

      @if (error()) {
        <p class="text-body-sm text-error">{{ error() }}</p>
      }

      <div class="flex justify-end gap-xs">
        <button class="btn btn-secondary btn-sm" (click)="close()" [disabled]="saving()">Cancel</button>
        <button class="btn btn-primary btn-sm" (click)="save()" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </div>
  </div>
}
