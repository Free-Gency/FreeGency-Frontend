
<div class="card flex flex-col gap-sm">
  <div class="flex items-center justify-between">
    <h2 class="text-headline-md">Files <span class="text-on-surface-variant font-normal text-lg">{{ files().length }}</span></h2>
    <label
      class="btn btn-secondary btn-sm cursor-pointer"
      [class.opacity-50]="uploading()"
      [class.pointer-events-none]="uploading()"
    >
      @if (uploading()) {
        Uploading...
      } @else {
        Upload
      }
      <input type="file" multiple hidden (change)="uploadFiles($event)" [disabled]="uploading()" />
    </label>
  </div>

  @if (loading()) {
    <p class="text-body-md text-on-surface-variant text-center py-md">Loading files...</p>
  } @else if (files().length === 0) {
    <p class="text-body-md text-on-surface-variant text-center py-md">No files uploaded.</p>
  } @else {
    <div class="flex flex-col gap-md">
      @for (kind of kindOrder; track kind) {
        @if (filesByKind(kind).length > 0) {
          <div class="flex flex-col gap-xs">
            <span class="text-label-mono text-on-surface-variant">{{ kindLabels[kind] }}</span>
            <div class="flex flex-col gap-1">
              @for (f of filesByKind(kind); track f.id) {
                <div class="flex items-center justify-between gap-sm py-2 px-sm rounded-md border border-outline-variant">
                  <div class="flex items-center gap-xs min-w-0">
                    <svg class="text-primary shrink-0" width="18" height="18" viewBox="0 0 18 18" fill="none">
                      <path d="M9.75 1.5H4.5C3.67 1.5 3 2.17 3 3V15C3 15.83 3.67 16.5 4.5 16.5H13.5C14.33 16.5 15 15.83 15 15V6.75L9.75 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      <path d="M9.75 1.5V6.75H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <a [href]="f.fileUrl" target="_blank" rel="noopener" class="text-body-sm text-on-surface truncate hover:underline hover:text-primary">{{ f.fileName }}</a>
                  </div>
                  <button
                    class="text-outline hover:text-error p-1 rounded-sm shrink-0"
                    [disabled]="deletingId() === f.id"
                    (click)="deleteFile(f.id)"
                  >
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                      <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              }
            </div>
          </div>
        }
      }
    </div>
  }
</div>
