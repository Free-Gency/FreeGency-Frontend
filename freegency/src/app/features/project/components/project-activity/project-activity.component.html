
<div class="card flex flex-col gap-sm">
  <h2 class="text-headline-md">Activity</h2>

  @if (loading()) {
    <p class="text-body-md text-on-surface-variant text-center py-sm">Loading activity...</p>
  } @else if (events().length === 0) {
    <p class="text-body-md text-on-surface-variant text-center py-sm">No activity yet.</p>
  } @else {
    <div class="flex flex-col">
      @for (e of events(); track e.id; let last = $last) {
        <div class="flex gap-sm">
          <div class="flex flex-col items-center shrink-0 w-3">
            <div class="w-2.5 h-2.5 rounded-full bg-primary mt-1.5 shrink-0"></div>
            @if (!last) {
              <div class="w-0.5 flex-1 bg-outline-variant mt-1"></div>
            }
          </div>
          <div class="flex flex-col gap-0.5 pb-sm">
            <div class="flex items-center justify-between gap-xs">
              <span class="text-label-mono text-on-surface uppercase tracking-wide text-xs">{{ eventLabel(e.eventType) }}</span>
              <span class="text-body-sm text-on-surface-variant">{{ relativeTime(e.createdAt) }}</span>
            </div>
            <p class="text-body-sm text-on-surface-variant">{{ e.actorUserName }}</p>
          </div>
        </div>
      }
    </div>
  }
</div>
