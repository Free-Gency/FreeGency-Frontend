@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" (click)="close()">
    <div
      class="w-full max-w-[420px] rounded-[28px] bg-white border border-outline-variant/20 shadow-lg flex flex-col overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between px-6 pt-6 pb-4">
        <h2 class="text-xl font-extrabold text-on-surface tracking-tight">Delete Project</h2>
        <button
          type="button"
          class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer"
          (click)="close()"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <p class="px-6 text-sm text-on-surface-variant leading-relaxed">
        Are you sure you want to delete this project? This action cannot be undone.
      </p>

      <div class="flex justify-end gap-2 px-6 py-5 mt-2 bg-[#FBFBFB] border-t border-outline-variant/15">
        <button
          type="button"
          class="inline-flex items-center justify-center !h-10 px-5 rounded-full text-sm font-bold bg-[#F0EDEF] text-on-surface hover:bg-[#E5E1E4] transition-colors cursor-pointer disabled:opacity-50"
          (click)="close()"
          [disabled]="deleting()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center !h-10 px-5 rounded-full text-sm font-bold bg-error text-on-error hover:opacity-90 transition-opacity cursor-pointer disabled:opacity-50"
          (click)="deleteProject()"
          [disabled]="deleting()"
        >
          {{ deleting() ? 'Deleting...' : 'Delete Project' }}
        </button>
      </div>
    </div>
  </div>
}
