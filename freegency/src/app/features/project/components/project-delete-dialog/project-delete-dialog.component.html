
@if (isOpen()) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-sm" (click)="close()">
    <div class="card card-modal w-full max-w-[420px] flex flex-col gap-sm" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h2 class="text-headline-md">Delete Project</h2>
        <button
          class="text-outline hover:text-on-surface hover:bg-surface-container-high p-1 rounded-sm flex items-center"
          (click)="close()"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <p class="text-body-md text-on-surface-variant">
        Are you sure you want to delete this project? This action cannot be undone.
      </p>

      <div class="flex justify-end gap-xs">
        <button class="btn btn-secondary btn-sm" (click)="close()" [disabled]="deleting()">Cancel</button>
        <button class="btn btn-danger btn-sm" (click)="deleteProject()" [disabled]="deleting()">
          {{ deleting() ? 'Deleting...' : 'Delete Project' }}
        </button>
      </div>
    </div>
  </div>
}
