<div class="client-home min-h-dvh bg-background">
  <app-client-view-navbar />

  <main class="mx-auto flex w-full max-w-[1400px] flex-col gap-8 px-5 py-8 sm:px-10 lg:px-16 lg:py-12">
    <section
      class="home-hero flex flex-col items-start justify-between gap-6 overflow-hidden rounded-[28px] bg-[#27253f] px-6 py-8 text-white sm:px-10 sm:py-10 lg:flex-row lg:items-center"
    >
      <div class="max-w-[680px]">
        <p class="mb-3 font-mono text-xs tracking-[0.12em] text-[#d6ff3f] uppercase">
          Client workspace
        </p>
        <h1 class="font-display text-3xl leading-tight font-bold sm:text-4xl lg:text-5xl">
          Welcome back, {{ firstName() }}
        </h1>
        <p class="mt-4 max-w-[560px] font-body text-sm leading-6 text-white/70 sm:text-base">
          Create projects, discover the right talent, and manage your work from one place.
        </p>
      </div>

      <a
        routerLink="/auth/client-onboarding/create-project"
        class="inline-flex h-12 cursor-pointer items-center gap-2 rounded-full bg-primary-container px-6 font-display text-sm font-semibold text-white transition-opacity hover:opacity-90 sm:text-base"
      >
        <hugeicons-icon
          [icon]="createIcon"
          [size]="19"
          color="currentColor"
          [strokeWidth]="2"
        />
        Create a project
      </a>
    </section>

  </main>
</div>
