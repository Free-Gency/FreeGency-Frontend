<div class="strength-indicator" aria-live="polite">
  @if (password()) {
    <div class="strength-segments">
      @for (segment of segments(); track $index) {
        <div 
          class="strength-segment"
          [class.active]="segment.active"
          [style.background-color]="segment.color"
          role="progressbar"
          [attr.aria-valuenow]="segments().filter(s => s.active).length"
          aria-valuemin="0"
          aria-valuemax="3"
        ></div>
      }
    </div>
    
    @if (showLabel()) {
      <span class="strength-label" [style.color]="strengthColor()">
        {{ strengthLabel() }}
      </span>
    }
    
    <ul class="requirements-list" aria-label="Password requirements">
      @for (requirement of requirements(); track requirement.text) {
        <li 
          class="requirement-item"
          [class.met]="requirement.met"
        >
          <svg class="requirement-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            @if (requirement.met) {
              <path d="M11.667 3.5L5.25 9.917 2.333 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            } @else {
              <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            }
          </svg>
          <span>{{ requirement.text }}</span>
        </li>
      }
    </ul>
  }
</div>
