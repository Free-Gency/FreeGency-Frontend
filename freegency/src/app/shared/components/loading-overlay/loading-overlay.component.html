@if (loading.isLoading()) {
  <div class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-overlay__card">
      <app-loading size="lg" label="Loading content" />
      <div class="loading-overlay__copy">
        <p class="loading-overlay__title">Just a moment</p>
        <p class="loading-overlay__message">We're getting everything ready for you</p>
      </div>
      <span class="loading-overlay__progress" aria-hidden="true"></span>
    </div>
  </div>
}
