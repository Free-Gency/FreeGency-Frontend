<div class="flex w-full max-w-[500px] justify-center gap-4 max-sm:gap-3">
  @for (digit of digits; track $index) {
    <input
      #otpBox
      class="h-[60px] w-[70px] rounded-sm border border-[rgba(229,225,228,0.2)] bg-surface-container-low text-center font-mono text-xl font-semibold text-on-surface transition-[background-color,border-color,box-shadow] duration-150 focus:border-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-[3px] focus:ring-primary/12 max-sm:h-[52px] max-sm:w-[44px] max-sm:text-lg"
      type="text"
      inputmode="numeric"
      maxlength="1"
      autocomplete="one-time-code"
      [attr.aria-label]="'Digit ' + ($index + 1)"
      (input)="onInput($index, $event)"
      (keydown)="onKeyDown($index, $event)"
      (paste)="onPaste($event)"
    />
  }
</div>
