@if (toastService.toasts().length > 0) {
  <div
    class="toast-stack"
    aria-live="polite"
  >
    @for (toast of toastService.toasts(); track toast.id) {
      <div
        class="toast-item"
        [class.toast-item--success]="toast.variant === 'success'"
        [class.toast-item--error]="toast.variant === 'error'"
        [class.toast-item--warning]="toast.variant === 'warning'"
        role="status"
      >
        <span
          class="toast-icon"
          aria-hidden="true"
        >
          <hugeicons-icon
            [icon]="variantIcon(toast.variant)"
            [size]="toast.variant === 'warning' ? 24 : 20"
            color="currentColor"
            [strokeWidth]="1.85"
          />
        </span>

        <div class="toast-copy">
          @if (toast.title) {
            <p class="toast-title">{{ toast.title }}</p>
          }
          <p class="toast-text">{{ toast.text }}</p>
        </div>

        <button
          type="button"
          class="toast-close"
          aria-label="Dismiss"
          (click)="toastService.dismiss(toast.id)"
        >
          <hugeicons-icon
            [icon]="closeIcon"
            [size]="14"
            color="currentColor"
            [strokeWidth]="2"
          />
        </button>
      </div>
    }
  </div>
}
