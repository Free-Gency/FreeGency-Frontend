<div class="w-full rounded-sm bg-surface-container-low p-sm text-left">
  <div class="mb-sm flex gap-1.5">
    @for (segment of segments(); track segment) {
      <span
        class="h-1 flex-1 rounded-full"
        [class.bg-primary-container]="segment < metCount()"
        [class.bg-surface-dim]="segment >= metCount()"
      ></span>
    }
  </div>
  @for (rule of rules(); track rule.label) {
    <div class="mb-1.5 flex items-center gap-xs text-sm text-on-surface-variant last:mb-0">
      <span
        class="size-5 shrink-0 rounded-full border-2"
        [class.border-outline-variant]="!rule.met"
        [class.border-primary-container]="rule.met"
        [class.bg-primary-container]="rule.met"
      ></span>
      <span>{{ rule.label }}</span>
    </div>
  }
</div>
