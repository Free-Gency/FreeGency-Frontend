<button
  type="button"
  class="btn btn-primary w-auto px-5 h-10 text-sm"
  (click)="isModalOpen.set(true)"
>
  <span class="material-symbols-outlined text-base">send</span>
  <span>Apply Now</span>
</button>

<app-apply-proposal-modal
  [projectId]="projectId"
  [isOpen]="isModalOpen()"
  (closed)="isModalOpen.set(false)"
  (submitted)="onSubmitted()"
/>
